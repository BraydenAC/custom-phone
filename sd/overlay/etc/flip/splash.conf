# Startup animation (/usr/lib/flip/splash). Changes apply at the next start.
# Try a setting without restarting: /usr/lib/flip/splash --demo 14
#                               or: /usr/lib/flip/splash --shutdown poweroff --demo 3
[splash]
# bloom: hexagons grow from the centre to the edges
# rise:  hexagons fill the screen from the bottom up
style = bloom
# Hexagon size in pixels (8-30)
hex_size = 15
# Show the current startup step (STORAGE..., WI-FI..., ...)
step_names = yes
# Seconds "READY" stays before the screen goes back to the text console
hold = 2
# Frames per second (the screen link manages roughly 10-20)
fps = 15

# --- shutdown (hexagons go dark, then OFF / RESTARTING) ---
# Seconds the hexagons take to go dark (the last ones also wait until every
# service has stopped)
shutdown_length = 3
# Powering off with a USB cable delivering power: show UNPLUG USB and wait at
# most this many seconds for it to come out (0 = don't ask)
unplug_wait = 8
