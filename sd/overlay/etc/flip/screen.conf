# Screen power (/usr/lib/flip/screen). Applies after
# `systemctl restart flip-screen` or the next start.
# The screen goes off when the lid closes, and after idle_off seconds without
# a key press. Opening the lid or pressing a key turns it back on.
# With the lid open, the phone sleeps after idle_sleep seconds without a key
# press, on battery only (on USB power it stays awake, like with the lid
# closed). The power key or closing and opening the lid wakes it.
# 0 = never, for either.
[screen]
idle_off = 600
idle_sleep = 900
