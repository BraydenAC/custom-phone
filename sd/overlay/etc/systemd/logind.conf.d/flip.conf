# The red end/power key (KEY_POWER, kernel patch 0002). A short press
# belongs to the phone apps (end a call), so logind ignores it; holding it
# about 5 seconds powers the phone off. Unplug USB first: powering off
# while plugged in has crashed the phone into download mode before.
#
# Closing the lid (hall sensor, kernel patch 0003) puts the phone to sleep;
# opening it or the power key wakes it. On USB power it stays awake (charging,
# and flip's USB link keeps working) -- flip-screen only turns the screen off.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
