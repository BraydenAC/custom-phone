# The modem's voice stream goes through the DSP (VoiceMMode1) straight to the
# codec; Linux only has to keep the VoiceMMode1 PCM open while a call is up
# (flip-call-audio does that).
SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' 0"
	]
	Value {
		TQ "Voice Call"
		PlaybackPCM "hw:${CardId},4"
		CapturePCM "hw:${CardId},4"
	}
}

Include.codec.File "/Nokia/weeknd/codec.conf"
