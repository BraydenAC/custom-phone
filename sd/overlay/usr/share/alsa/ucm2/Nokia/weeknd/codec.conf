# PM8916 analog/digital codec paths, shared by both use cases.
# Playback: DSP -> Primary MI2S -> RX1/RX2/RX3. Capture: ADC -> DEC1 -> Tertiary MI2S.

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [ "Earpiece" "Headphones" ]
	EnableSequence [
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='RX3 Digital Volume' 128"
		cset "name='SPK DAC Switch' 1"
	]
	DisableSequence [
		cset "name='SPK DAC Switch' 0"
		cset "name='RX3 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "RX3 Digital"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [ "Speaker" "Headphones" ]
	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX1 Digital Volume' 128"
		cset "name='EAR_S' Switch"
	]
	DisableSequence [
		cset "name='EAR_S' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "RX1 Digital"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Speaker" "Earpiece" ]
	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='RX1 Digital Volume' 128"
		cset "name='RX2 Digital Volume' 128"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
	]
	DisableSequence [
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
		cset "name='RDAC2 MUX' RX1"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "RX1 Digital"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Phone microphone"
	ConflictingDevice [ "Headset" ]
	EnableSequence [
		cset "name='CIC1 MUX' AMIC"
		cset "name='DEC1 MUX' ADC1"
		cset "name='ADC1 Volume' 8"
	]
	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"
	ConflictingDevice [ "Mic" ]
	EnableSequence [
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC2 MUX' INP2"
		cset "name='DEC1 MUX' ADC2"
		cset "name='ADC2 Volume' 8"
	]
	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
		cset "name='ADC2 MUX' ZERO"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC2"
		JackControl "Headset Mic Jack"
	}
}
