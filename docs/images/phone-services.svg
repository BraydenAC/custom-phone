<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>What runs on the phone</title>
<desc>Debian on the SD card runs flip's services: flipd and flip-gadget for the USB admin link, screen, splash, battery-log and modem-data, plus the systemd stack, on top of the Linux kernel with flip's patches.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.purple > rect { fill: #EEEDFE; stroke: #534AB7; } .purple > .th { fill: #3C3489; } .purple > .ts { fill: #534AB7; }
.teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .teal > .th { fill: #085041; } .teal > .ts { fill: #0F6E56; }
.gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray > .th { fill: #444441; } .gray > .ts { fill: #5F5E5A; }
@media (prefers-color-scheme: dark) {
  .ts { fill: #B4B2A9; }
  .purple > rect { fill: #3C3489; stroke: #AFA9EC; } .purple > .th { fill: #EEEDFE; } .purple > .ts { fill: #CECBF6; }
  .teal > rect { fill: #04342C; stroke: #5DCAA5; } .teal > .th { fill: #E1F5EE; } .teal > .ts { fill: #9FE1CB; }
  .gray > rect { fill: #444441; stroke: #B4B2A9; } .gray > .th { fill: #F1EFE8; } .gray > .ts { fill: #D3D1C7; }
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="teal"><rect x="110" y="30" width="540" height="320" rx="20" stroke-width="0.5"/><text class="th" x="130" y="56">Debian 13 on the SD card</text><text class="ts" x="130" y="74">sd/setup.sh + sd/overlay</text></g>
<g class="gray"><rect x="134" y="96" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="212" y="114" text-anchor="middle" dominant-baseline="central">flipd + gadget</text><text class="ts" x="212" y="134" text-anchor="middle" dominant-baseline="central">admin over USB</text></g>
<g class="gray"><rect x="302" y="96" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="380" y="114" text-anchor="middle" dominant-baseline="central">screen</text><text class="ts" x="380" y="134" text-anchor="middle" dominant-baseline="central">off 10m, sleep 15m</text></g>
<g class="gray"><rect x="470" y="96" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="548" y="114" text-anchor="middle" dominant-baseline="central">splash</text><text class="ts" x="548" y="134" text-anchor="middle" dominant-baseline="central">boot, shutdown</text></g>
<g class="gray"><rect x="134" y="168" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="212" y="186" text-anchor="middle" dominant-baseline="central">battery-log</text><text class="ts" x="212" y="206" text-anchor="middle" dominant-baseline="central">one line a minute</text></g>
<g class="gray"><rect x="302" y="168" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="380" y="186" text-anchor="middle" dominant-baseline="central">modem-data</text><text class="ts" x="380" y="206" text-anchor="middle" dominant-baseline="central">waits for a SIM</text></g>
<g class="gray"><rect x="470" y="168" width="156" height="56" rx="8" stroke-width="0.5"/><text class="th" x="548" y="186" text-anchor="middle" dominant-baseline="central">systemd stack</text><text class="ts" x="548" y="206" text-anchor="middle" dominant-baseline="central">logind, NM, nftables</text></g>
<g class="purple"><rect x="134" y="250" width="492" height="56" rx="8" stroke-width="0.5"/><text class="th" x="380" y="268" text-anchor="middle" dominant-baseline="central">Linux kernel</text><text class="ts" x="380" y="288" text-anchor="middle" dominant-baseline="central">defconfig + patches: battery, power key, lid</text></g>
<text class="ts" x="380" y="332" text-anchor="middle">Built on your computer by flip build</text>
<text class="ts" x="30" y="128">flip CLI</text>
<line x1="84" y1="124" x2="132" y2="124" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
