<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
<title>flip system overview</title>
<desc>Your computer holds pinned inputs, the flip CLI, build outputs and private backups. flip reaches the phone over USB: flash writes lk2nd to the eMMC, sd write puts Debian on the SD card, flip phone administers Debian, backup copies the stock eMMC.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.purple > rect { fill: #EEEDFE; stroke: #534AB7; } .purple > .th { fill: #3C3489; }
.teal > rect { fill: #E1F5EE; stroke: #0F6E56; } .teal > .th { fill: #085041; }
.gray > rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray > .th { fill: #444441; } .gray > .ts { fill: #5F5E5A; }
.coral > rect, rect.coral { fill: #FAECE7; stroke: #993C1D; } .coral > .th { fill: #712B13; } .coral > .ts { fill: #993C1D; }
@media (prefers-color-scheme: dark) {
  .ts { fill: #B4B2A9; }
  .purple > rect { fill: #26215C; stroke: #AFA9EC; } .purple > .th { fill: #EEEDFE; }
  .teal > rect { fill: #04342C; stroke: #5DCAA5; } .teal > .th { fill: #E1F5EE; }
  .gray > rect { fill: #444441; stroke: #B4B2A9; } .gray > .th { fill: #F1EFE8; } .gray > .ts { fill: #D3D1C7; }
  .coral > rect, rect.coral { fill: #712B13; stroke: #F0997B; } .coral > .th { fill: #FAECE7; } .coral > .ts { fill: #F5C4B3; }
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="purple"><rect x="30" y="30" width="620" height="140" rx="20" stroke-width="0.5"/><text class="th" x="50" y="56">Your computer</text></g>
<g class="gray"><rect x="47" y="80" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="109" y="98" text-anchor="middle" dominant-baseline="central">Pinned inputs</text><text class="ts" x="109" y="118" text-anchor="middle" dominant-baseline="central">patches, pins</text></g>
<g class="gray"><rect x="201" y="80" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263" y="98" text-anchor="middle" dominant-baseline="central">flip CLI</text><text class="ts" x="263" y="118" text-anchor="middle" dominant-baseline="central">src/flip, tests</text></g>
<g class="gray"><rect x="355" y="80" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="98" text-anchor="middle" dominant-baseline="central">out/</text><text class="ts" x="417" y="118" text-anchor="middle" dominant-baseline="central">images, sd.img</text></g>
<g class="coral"><rect x="509" y="80" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="571" y="98" text-anchor="middle" dominant-baseline="central">backups/</text><text class="ts" x="571" y="118" text-anchor="middle" dominant-baseline="central">private data</text></g>
<line x1="171" y1="108" x2="199" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="108" x2="353" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="138" x2="240" y2="298" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="212" text-anchor="end">flip phone (USB)</text>
<path d="M380 136 L380 225 L300 225 L300 298" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="372" y="196" text-anchor="end">sd write/update</text>
<line x1="440" y1="136" x2="440" y2="298" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="212">flash</text>
<line x1="600" y1="300" x2="600" y2="138" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="592" y="212" text-anchor="end">backup</text>
<g class="teal"><rect x="30" y="250" width="620" height="130" rx="20" stroke-width="0.5"/><text class="th" x="50" y="276">Nokia 2780 Flip</text></g>
<g class="gray"><rect x="47" y="300" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="109" y="318" text-anchor="middle" dominant-baseline="central">Hardware</text><text class="ts" x="109" y="338" text-anchor="middle" dominant-baseline="central">screen, lid, modem</text></g>
<g class="gray"><rect x="201" y="300" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263" y="318" text-anchor="middle" dominant-baseline="central">Debian on SD</text><text class="ts" x="263" y="338" text-anchor="middle" dominant-baseline="central">kernel, services</text></g>
<g class="gray"><rect x="355" y="300" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="318" text-anchor="middle" dominant-baseline="central">lk2nd</text><text class="ts" x="417" y="338" text-anchor="middle" dominant-baseline="central">boot menu</text></g>
<g class="gray"><rect x="509" y="300" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="571" y="318" text-anchor="middle" dominant-baseline="central">Stock eMMC</text><text class="ts" x="571" y="338" text-anchor="middle" dominant-baseline="central">KaiOS, radio data</text></g>
<line x1="201" y1="328" x2="173" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="355" y1="328" x2="327" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="40" y1="410" x2="70" y2="410" class="arr" stroke-dasharray="4 3"/>
<text class="ts" x="80" y="414">Changes the phone's storage: run by hand</text>
<rect class="coral" x="350" y="403" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="372" y="414">Private: never committed or shared</text>
</svg>
